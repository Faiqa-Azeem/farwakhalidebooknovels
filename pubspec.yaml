name: farwa_khalid_ebook_novels
description: "eBook novel reader app for Farwa Khalid"

publish_to: 'none'

version: 1.0.21+71

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.0.15
  dio: ^5.0.3
  connectivity_plus: ^7.0.0
  google_fonts: ^8.0.2
  email_validator: ^3.0.0
  firebase_core: any
  firebase_storage: any
  firebase_auth: any
  google_sign_in: ^7.2.0
  shared_preferences: ^2.2.2
  cloud_firestore: any
  image_picker: ^1.1.2
  file_picker: ^11.0.2
  archive: ^4.0.9
  xml: ^6.5.0
  sign_in_with_apple: ^7.0.1
  crypto: ^3.0.6
  syncfusion_flutter_pdf: ^32.2.9
  flutter_quill: ^11.5.1
  supabase_flutter: ^2.5.5
  http: ^1.6.0
  cupertino_icons: ^1.0.8
  google_mobile_ads: ^7.0.0
  cached_network_image: ^3.3.1
  url_launcher: ^6.2.5
  screen_protector: ^1.5.1
  in_app_purchase: ^3.3.0
  device_info_plus: ^11.5.0
  super_clipboard: ^0.9.1
  super_native_extensions: ^0.9.1
  audioplayers: ^6.6.0
  app_tracking_transparency: ^2.0.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.6
  hive_generator: ^2.0.1
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  config:
    enable-swift-package-manager: false

  assets:
    - assets/images/logo.png
    - assets/images/google_icon.png

  fonts:
    - family: DancingScript
      fonts:
        - asset: assets/fonts/DancingScript-Regular.ttf

    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf

    - family: JameelNooriNastaleeq
      fonts:
        - asset: assets/fonts/JameelNooriNastaleeq-Regular.ttf

flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/images/logo.png"

